<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoSelect Pro · Choose Language</title>
  <link rel="stylesheet" href="language-setup.css">
</head>
<body>
  <main class="language-shell">
    <section class="language-card">
      <div class="badge">AutoSelect Pro</div>
      <h1>Choose your language</h1>
      <p>
        The extension works in the FREE plan right after install.
        The trial only unlocks PRO features.
      </p>

      <div class="language-actions">
        <button id="btnEnglish" class="lang-btn primary" type="button">English (Default)</button>
        <button id="btnSpanish" class="lang-btn" type="button">Español</button>
      </div>

      <p class="footnote" id="statusText">You can change this later from Options.</p>
    </section>
  </main>

  <script src="language-setup.js"></script>
</body>
</html>
